}
```

## Idempotency Guarantee

```yaml
idempotency:
  description: Task can be safely executed multiple times with same result
  
  mechanisms:
    - Content hash prevents re-processing identical files
    - Database UNIQUE constraint prevents duplicate chunks
    - try/except IntegrityError makes inserts safe
    
  scenarios:
    duplicate_task_execution:
      cause: Worker restarts, task requeued
      result: Second execution returns "skipped" status
      side_effects: None
      
    partial_completion:
      cause: Task crashes after inserting 5/10 chunks
      result: Retry inserts all 10, first 5 hit IntegrityError
      side_effects: All 10 chunks present after retry
      
    concurrent_execution:
      cause: Two workers pick up duplicate tasks
      result: First completes, second sees duplicates
      side_effects: Single set of chunks in database
```