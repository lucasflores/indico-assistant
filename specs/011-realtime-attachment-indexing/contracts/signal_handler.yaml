# Signal Handler Contract

**Feature**: 011-realtime-attachment-indexing  
**Component**: Signal Handler  
**File**: `indico_assistant/plugin.py`

## Interface

### Signal Connection

```python
from indico.modules.attachments import signals as attachment_signals

class AssistantPlugin(IndicoPlugin):
    def init(self):
        super().init()
        # Connect attachment_created signal
        attachment_signals.attachment_created.connect(
            self._on_attachment_created
        )
```

### Handler Signature

```python
def _on_attachment_created(
    self,
    sender: Any,
    attachment: Attachment,
    **kwargs
) -> None:
    """Handle attachment creation signal for real-time indexing.
    
    Args:
        sender: Signal sender (attachment folder object)
        attachment: Newly created Indico Attachment instance
        **kwargs: Additional signal parameters (for forward compatibility)
        
    Returns:
        None - Handler must not raise exceptions
        
    Performance:
        - MUST complete in <100ms (99th percentile)
        - MUST NOT perform I/O operations
        - MUST NOT block Indico request cycle
    """
```

## Input Contract

### Attachment Object Properties

```yaml
attachment:
  id:
    type: integer
    description: Unique attachment identifier
    example: 12345
    
  file:
    type: AttachmentFile | null
    properties:
      filename:
        type: string
        description: Original uploaded filename
        example: "presentation.pdf"
        
      size:
        type: integer
        description: File size in bytes
        example: 5242880  # 5MB
        min: 0
        max: 52428800  # 50MB (rejected above this)
        
      content_type:
        type: string
        description: MIME type
        example: "application/pdf"
        enum:
          - "application/pdf"
          - "application/vnd.openxmlformats-officedocument.wordprocessingml.document"
          - "text/plain"
          - "text/markdown"
          
      open:
        type: method
        returns: file-like object
        description: Opens file for reading
        
  folder:
    type: AttachmentFolder
    properties:
      event:
        type: Event
        properties:
          id:
            type: integer
            description: Parent event ID
            example: 789
```

## Behavior Contract

### Decision Logic

```yaml
1_check_vector_search_enabled:
  condition: settings.get('vector_search_enabled') == False
  action: return  # Skip processing
  log_level: debug
  log_message: "Vector search disabled, skipping attachment {attachment.id}"

2_check_pgvector_available:
  condition: not check_pgvector_available()
  action: return  # Skip processing
  log_level: warning
  log_message: "pgvector unavailable, skipping attachment {attachment.id}"

3_check_file_exists:
  condition: attachment.file is None
  action: return  # Skip processing
  log_level: debug
  log_message: "Attachment {attachment.id} has no file"

4_check_format:
  condition: not is_supported_format(attachment)
  action: return  # Skip processing
  log_level: debug
  log_message: "Unsupported format: {attachment.file.filename}"

5_check_size:
  condition: attachment.file.size > MAX_SIZE_BEST_EFFORT
  action: return  # Reject large files
  log_level: info
  log_message: "File too large: {attachment.file.size} bytes > 50MB"

6_queue_task:
  condition: all checks passed
  action: index_attachment_task.apply_async()
  log_level: info
  log_message: "Queued indexing task for attachment {attachment.id}"
```

### Error Handling

```yaml
exception_policy:
  catch_all: true
  log_level: error
  log_traceback: true
  reraise: false  # MUST NOT propagate exceptions
  message: "Signal handler failed for attachment {attachment.id}: {error}"
```

## Output Contract

### Task Queueing

```yaml
task_parameters:
  attachment_id:
    type: integer
    source: attachment.id
    required: true
    
  event_id:
    type: integer
    source: attachment.folder.event.id
    required: true
    
  priority:
    type: integer
    range: [0, 9]
    default: 5
    logic:
      - if file_size < 10MB: priority = 5 (high)
      - if file_size >= 10MB: priority = 9 (low)
```

### Return Value

```yaml
return_value:
  type: None
  description: Handler returns nothing, communicates via task queue
```

## Performance Requirements

```yaml
timing:
  target_p50: 10ms
  target_p95: 50ms
  target_p99: 100ms
  max_acceptable: 200ms
  
operations:
  allowed:
    - In-memory checks (format, size)
    - Settings lookup
    - Task queueing (async)
    
  prohibited:
    - File I/O (reading attachment content)
    - Database queries
    - Network calls
    - Synchronous task execution
```

