## Example Usage

```python
# Test fixture example
def test_signal_handler():
    # Mock attachment
    attachment = Mock(spec=Attachment)
    attachment.id = 123
    attachment.file = Mock()
    attachment.file.size = 5 * 1024 * 1024  # 5MB
    attachment.file.filename = "test.pdf"
    attachment.file.content_type = "application/pdf"
    attachment.folder.event.id = 789
    
    # Mock settings
    plugin = AssistantPlugin()
    plugin.settings.set('vector_search_enabled', True)
    
    # Call handler
    plugin._on_attachment_created(sender=None, attachment=attachment)
    
    # Assert task was queued
    assert index_attachment_task.apply_async.called
    assert index_attachment_task.apply_async.call_args[1]['args'] == [123, 789]
    assert index_attachment_task.apply_async.call_args[1]['priority'] == 5
```