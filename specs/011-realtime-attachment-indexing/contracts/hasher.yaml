## Example Usage

```python
# In indexing task
from indico_assistant.services.document.hasher import compute_content_hash

def index_attachment_task(attachment_id, event_id):
    # Step 1: Fetch attachment
    attachment = Attachment.query.get(attachment_id)
    
    # Step 2: Compute hash
    with attachment.file.open() as f:
        content_hash = compute_content_hash(f)
    
    # Step 3: Check duplicate
    existing = ExtractedDocument.query.filter_by(
        event_id=event_id,
        content_hash=content_hash
    ).first()
    
    if existing:
        return {'status': 'skipped', 'content_hash': content_hash}
```

## Security Considerations

```yaml
hash_collision_probability:
  algorithm: SHA256
  probability: 2^-256 (negligible)
  mitigation: Not needed (astronomically unlikely)
  
content_validation:
  purpose: Duplicate detection only
  not_for: Cryptographic verification, digital signatures
  
side_channel_attacks:
  timing: Not constant-time (not a security requirement)
  reason: Hash computation time reveals file size (acceptable)
```

