# Content Hash Computation Contract

**Feature**: 011-realtime-attachment-indexing  
**Component**: Content Hasher  
**File**: `indico_assistant/services/document/hasher.py`

## Interface

### Function Signature

```python
def compute_content_hash(file_obj: BinaryIO) -> str:
    """Compute SHA256 hash of file content using streaming approach.
    
    Args:
        file_obj: Binary file-like object opened for reading
        
    Returns:
        Hexadecimal string representation of SHA256 hash (64 characters)
        
    Performance:
        - Memory efficient: Uses 8KB chunk streaming
        - ~100ms for 10MB file
        - O(n) time complexity where n = file size
        
    Example:
        >>> with open('document.pdf', 'rb') as f:
        ...     hash_value = compute_content_hash(f)
        >>> hash_value
        'abc123def456...'  # 64 hex characters
    """
```

## Input Contract

```yaml
file_obj:
  type: BinaryIO
  description: File-like object supporting read() method
  requirements:
    - Must be opened in binary mode ('rb')
    - Must support seek(0) to reset position
    - Must support read(size) with variable size
  examples:
    - io.BytesIO(b'content')
    - open('file.pdf', 'rb')
    - attachment.file.open()  # Indico attachment file object
```

## Output Contract

```yaml
return_value:
  type: str
  format: hexadecimal
  length: 64
  pattern: "^[a-f0-9]{64}$"
  description: SHA256 hash as lowercase hex string
  examples:
    - "e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855"  # empty file
    - "2c26b46b68ffc68ff99b453c1d30413413422d706483bfa0f98a5e886266e7ae"  # "foo"
```

## Implementation Requirements

### Algorithm

```yaml
algorithm: SHA256
library: hashlib.sha256()
chunk_size: 8192 bytes  # 8KB chunks
reason: Balance between memory efficiency and I/O performance
```

### Streaming Approach

```python
# Pseudo-code for streaming hash computation
import hashlib

def compute_content_hash(file_obj: BinaryIO) -> str:
    hasher = hashlib.sha256()
    
    # Reset file position to beginning
    file_obj.seek(0)
    
    # Read in 8KB chunks
    while chunk := file_obj.read(8192):
        hasher.update(chunk)
    
    # Return hex digest
    return hasher.hexdigest()
```

### Memory Constraints

```yaml
max_memory_usage: 8KB + hash state (~256 bytes)
reason: Streaming approach prevents loading entire file into memory
scalability: Can handle multi-GB files without OOM errors
```

## Performance Contract

```yaml
performance_targets:
  small_files:
    size: "<1MB"
    time: "<10ms"
    
  medium_files:
    size: "1-10MB"
    time: "<100ms"
    
  large_files:
    size: "10-50MB"
    time: "<500ms"
    
  measurement_method: "time.perf_counter() around function call"
```

## Error Handling

```yaml
exceptions:
  IOError:
    when: File cannot be read (permission denied, file deleted)
    action: Propagate exception to caller
    
  OSError:
    when: Disk read error, network filesystem issue
    action: Propagate exception to caller
    
  ValueError:
    when: file_obj is None or not a file-like object
    action: Raise with clear message "file_obj must be a file-like object"

error_policy:
  - Never return None (always return 64-char hex string or raise)
  - Reset file position with seek(0) before reading
  - Close file_obj is caller's responsibility (don't close in function)
```

